<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF3E3"/>
      <stop offset="1" stop-color="#F0E4CC"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D7BFA0"/>
      <stop offset="1" stop-color="#C3A582"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8D6E63"/>
      <stop offset="0.5" stop-color="#A1887F"/>
      <stop offset="1" stop-color="#795548"/>
    </linearGradient>
    <linearGradient id="woodLeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D4C41"/>
      <stop offset="1" stop-color="#4E342E"/>
    </linearGradient>
    <linearGradient id="chairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B5B4F"/>
      <stop offset="1" stop-color="#5D4037"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9EC"/>
      <stop offset="1" stop-color="#FFE9C2"/>
    </linearGradient>
  </defs>

  <!-- Room -->
  <rect width="400" height="210" fill="url(#wall)"/>
  <rect y="210" width="400" height="90" fill="url(#floor)"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#B09067" stroke-width="2"/>
  <!-- floor boards -->
  <g stroke="#B99A76" stroke-width="1" opacity="0.6">
    <line x1="0" y1="235" x2="400" y2="232"/>
    <line x1="0" y1="262" x2="400" y2="258"/>
    <line x1="0" y1="288" x2="400" y2="284"/>
  </g>

  <!-- Window -->
  <rect x="28" y="34" width="86" height="110" rx="4" fill="url(#windowLight)" stroke="#C9B08E" stroke-width="5"/>
  <line x1="71" y1="34" x2="71" y2="144" stroke="#C9B08E" stroke-width="4"/>
  <line x1="28" y1="90" x2="114" y2="90" stroke="#C9B08E" stroke-width="4"/>

  <!-- Wall art -->
  <rect x="255" y="45" width="60" height="46" rx="3" fill="#FFFDF6" stroke="#A1887F" stroke-width="4"/>
  <path d="M260 84 L278 62 L290 76 L300 66 L310 84 Z" fill="#8D6E63"/>
  <circle cx="271" cy="58" r="5" fill="#E0B252"/>

  <!-- Pendant lamp -->
  <line x1="200" y1="0" x2="200" y2="52" stroke="#6D4C41" stroke-width="3"/>
  <path d="M178 52 Q200 38 222 52 L216 72 Q200 80 184 72 Z" fill="#5D4037"/>
  <ellipse cx="200" cy="74" rx="12" ry="5" fill="#FFE9A8"/>

  <!-- Back chairs -->
  <g>
    <rect x="142" y="118" width="34" height="52" rx="6" fill="#8D6E63"/>
    <rect x="147" y="124" width="24" height="34" rx="4" fill="#A1887F"/>
    <rect x="228" y="118" width="34" height="52" rx="6" fill="#8D6E63"/>
    <rect x="233" y="124" width="24" height="34" rx="4" fill="#A1887F"/>
  </g>

  <!-- Table -->
  <ellipse cx="202" cy="248" rx="118" ry="14" fill="#3E2723" opacity="0.18"/>
  <rect x="88" y="166" width="228" height="16" rx="6" fill="url(#woodTop)"/>
  <rect x="88" y="182" width="228" height="6" rx="3" fill="#5D4037"/>
  <rect x="104" y="188" width="14" height="56" rx="3" fill="url(#woodLeg)"/>
  <rect x="286" y="188" width="14" height="56" rx="3" fill="url(#woodLeg)"/>

  <!-- Tableware -->
  <ellipse cx="150" cy="165" rx="18" ry="6" fill="#EFE5D2" stroke="#C9B08E"/>
  <ellipse cx="252" cy="165" rx="18" ry="6" fill="#EFE5D2" stroke="#C9B08E"/>
  <ellipse cx="201" cy="162" rx="14" ry="6" fill="#B85C38"/>
  <path d="M195 158 Q201 148 207 158" stroke="#7A9E5F" stroke-width="3" fill="none"/>

  <!-- Front chairs -->
  <g>
    <rect x="96" y="150" width="44" height="26" rx="6" fill="url(#chairBack)"/>
    <rect x="96" y="176" width="44" height="42" rx="8" fill="#6D4C41"/>
    <rect x="100" y="218" width="9" height="34" rx="3" fill="url(#woodLeg)"/>
    <rect x="127" y="218" width="9" height="34" rx="3" fill="url(#woodLeg)"/>
    <rect x="264" y="150" width="44" height="26" rx="6" fill="url(#chairBack)"/>
    <rect x="264" y="176" width="44" height="42" rx="8" fill="#6D4C41"/>
    <rect x="268" y="218" width="9" height="34" rx="3" fill="url(#woodLeg)"/>
    <rect x="295" y="218" width="9" height="34" rx="3" fill="url(#woodLeg)"/>
  </g>

  <!-- Plant -->
  <g>
    <path d="M352 158 Q344 130 358 112 M352 158 Q362 132 348 116 M352 158 Q352 128 366 122" stroke="#6B8E4E" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M340 158 h26 l-4 34 h-18 Z" fill="#B85C38"/>
    <path d="M340 158 h26 l-1 8 h-24 Z" fill="#9C4A2B"/>
  </g>
</svg>
