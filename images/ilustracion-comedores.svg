<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de comedor a medida">
  <defs>
    <linearGradient id="fondoCom" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8E7"/>
      <stop offset="1" stop-color="#F3E3CE"/>
    </linearGradient>
    <linearGradient id="maderaCom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8D6E63"/>
      <stop offset="1" stop-color="#5D4037"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#fondoCom)"/>

  <!-- Trama sutil de la marca -->
  <g fill="#5D4037" opacity="0.05">
    <path d="M120 90h-3v-8h-2v8h-8v2h8v8h2v-8h3z"/>
    <path d="M690 140h-3v-8h-2v8h-8v2h8v8h2v-8h3z"/>
    <path d="M660 470h-3v-8h-2v8h-8v2h8v8h2v-8h3z"/>
    <path d="M140 480h-3v-8h-2v8h-8v2h8v8h2v-8h3z"/>
  </g>

  <!-- Halo detras del mueble -->
  <ellipse cx="400" cy="320" rx="250" ry="180" fill="#5D4037" opacity="0.04"/>

  <!-- Lampara colgante -->
  <line x1="400" y1="60" x2="400" y2="132" stroke="#8D6E63" stroke-width="3"/>
  <path d="M360 168c0-22 18-36 40-36s40 14 40 36z" fill="url(#maderaCom)"/>
  <ellipse cx="400" cy="168" rx="40" ry="7" fill="#4E342E"/>
  <ellipse cx="400" cy="196" rx="52" ry="12" fill="#FFC680" opacity="0.35"/>

  <!-- Sillas del fondo -->
  <g fill="#8D6E63">
    <rect x="286" y="238" width="54" height="76" rx="10"/>
    <rect x="460" y="238" width="54" height="76" rx="10"/>
  </g>

  <!-- Mesa: tablero -->
  <rect x="196" y="312" width="408" height="22" rx="7" fill="url(#maderaCom)"/>
  <rect x="196" y="312" width="408" height="7" rx="3.5" fill="#A1887F"/>

  <!-- Patas y travesano -->
  <rect x="238" y="334" width="17" height="118" rx="5" fill="#4E342E"/>
  <rect x="545" y="334" width="17" height="118" rx="5" fill="#4E342E"/>
  <rect x="238" y="392" width="324" height="10" rx="5" fill="#5D4037"/>

  <!-- Sillas del frente -->
  <g fill="#6D4C41">
    <rect x="268" y="352" width="60" height="14" rx="6"/>
    <rect x="274" y="366" width="10" height="76" rx="4"/>
    <rect x="312" y="366" width="10" height="76" rx="4"/>
    <rect x="472" y="352" width="60" height="14" rx="6"/>
    <rect x="478" y="366" width="10" height="76" rx="4"/>
    <rect x="516" y="366" width="10" height="76" rx="4"/>
  </g>

  <!-- Vajilla -->
  <g>
    <ellipse cx="330" cy="308" rx="30" ry="9" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="330" cy="306" rx="19" ry="5.5" fill="#F3E3CE"/>
    <ellipse cx="470" cy="308" rx="30" ry="9" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="470" cy="306" rx="19" ry="5.5" fill="#F3E3CE"/>
    <path d="M392 282h16v26h-16z" fill="#A1887F"/>
    <ellipse cx="400" cy="282" rx="8" ry="4" fill="#C8A87C"/>
  </g>

  <!-- Sombra en el piso -->
  <ellipse cx="400" cy="462" rx="215" ry="16" fill="#5D4037" opacity="0.12"/>

  <!-- Etiqueta -->
  <g>
    <rect x="266" y="506" width="268" height="42" rx="21" fill="#5D4037"/>
    <text x="400" y="533" font-family="Poppins, Verdana, sans-serif" font-size="19" font-weight="600" fill="#FFF8E7" text-anchor="middle">Comedores a tu medida</text>
  </g>
</svg>
