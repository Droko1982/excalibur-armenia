  <path d="M254 320h11a7 7 0 010 14h-11z" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.92"/>

  <ellipse cx="400" cy="478" rx="228" ry="15" fill="#5D4037" opacity="0.12"/>

  <g>
